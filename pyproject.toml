[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "temp-rdl"
version = "0.1.0"
description = "Temp-RDL model implementations with Mean pooling and Attention"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch==2.5.1", "torch-geometric==2.7.0", "pytorch-frame==0.3.0",
  "numpy>=1.26,<3", "pandas>=2.2,<3"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
license-files = ["licenses/RelBench-APACHE-2.0.txt"]
